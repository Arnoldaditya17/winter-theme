name: winter_theme
description: Snow effects for Flutter. Snowfall makes it snow over any widget, and SnowCap lets snow build up on its top edge, drape over rounded corners and break off the sides.
version: 1.1.0
homepage: https://github.com/Arnoldaditya17/winter-theme
repository: https://github.com/Arnoldaditya17/winter-theme
issue_tracker: https://github.com/Arnoldaditya17/winter-theme/issues

topics:
  - snow
  - snowfall
  - animation
  - winter
  - effects

screenshots:
  - description: Snowfall with ice crystals and wind gusts over a whole screen.
    path: screenshots/snowfall.gif
  - description: Full-screen snow with the example app's live controls.
    path: screenshots/snowfall.png
  - description: A custom festive color palette with larger crystals.
    path: screenshots/festive.png
  - description: SnowCap building up on a card, then breaking off at the corners.
    path: screenshots/snowcap.gif
  - description: SnowCap patches forming, before they join into one heap.
    path: screenshots/snowcap_patches.png
  - description: A full SnowCap heap draped over a rounded card.
    path: screenshots/snowcap_settled.png
  - description: A piece of SnowCap tipping over the corner and falling.
    path: screenshots/snowcap_break.png

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
